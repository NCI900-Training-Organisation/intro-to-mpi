<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Two-dimensional heat equation with row decomposition</title>
  <desc id="desc">A five-point heat stencil averages the north, south, east, and west neighbours. A two-rank row decomposition gives each rank owned rows plus top and bottom ghost rows exchanged with neighbouring ranks.</desc>
  <defs>
    <style>
      .bg { fill: #fff8f1; }
      .ink { fill: #49231a; font-family: sans-serif; }
      .muted { fill: #8a4d36; font-family: sans-serif; }
      .title { font-size: 30px; font-weight: 700; }
      .heading { font-size: 22px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 700; }
      .small { font-size: 16px; }
      .tiny { font-size: 14px; }
      .boundary-text { fill: #fff8f1; font-size: 14px; }
      .rank0 { fill: #ffd3a6; stroke: #d9572b; stroke-width: 2; }
      .rank1 { fill: #ffb36b; stroke: #c94424; stroke-width: 2; }
      .ghost { fill: #f06a4f; stroke: #a52e25; stroke-width: 2; }
      .boundary { fill: #8f241f; stroke: #6d1b1a; stroke-width: 2; }
      .stencil { fill: #ff8a4c; stroke: #a52e25; stroke-width: 3; }
      .neighbour { fill: #ffd3a6; stroke: #d9572b; stroke-width: 3; }
      .panel { fill: #fff0df; stroke: #d9572b; stroke-width: 3; }
      .exchange { fill: #ffe0c2; stroke: #b83b26; stroke-width: 2; }
      .arrow { stroke: #a52e25; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .double-arrow { stroke: #c94424; stroke-width: 3; fill: none; marker-start: url(#arrow); marker-end: url(#arrow); }
      .grid-line { stroke: #a9442b; stroke-width: 1.5; }
      .divider { stroke: #c77a55; stroke-width: 2; stroke-dasharray: 8 7; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a52e25"/>
    </marker>
  </defs>

  <rect class="bg" width="1400" height="820"/>
  <text class="ink title" x="55" y="55">Distributed 2-D heat equation</text>
  <text class="muted small" x="55" y="84">Each interior cell is replaced by the average of its north, south, east, and west neighbours.</text>

  <rect class="panel" x="55" y="125" width="650" height="610" rx="18"/>
  <text class="ink heading" x="380" y="165" text-anchor="middle">Global grid: 1-D row decomposition</text>
  <text class="muted small" x="380" y="192" text-anchor="middle">Two MPI ranks share boundary rows through ghost cells.</text>

  <text class="muted tiny" x="118" y="226" text-anchor="end">top boundary</text>
  <rect class="boundary" x="125" y="205" width="420" height="28" rx="4"/>
  <text class="boundary-text" x="335" y="224" text-anchor="middle">fixed global boundary</text>

  <g>
    <rect class="ghost" x="125" y="240" width="420" height="34" rx="4"/>
    <text class="ink small" x="335" y="263" text-anchor="middle">Rank 0: bottom ghost row</text>
    <rect class="rank0" x="125" y="278" width="420" height="34" rx="4"/>
    <rect class="rank0" x="125" y="316" width="420" height="34" rx="4"/>
    <rect class="rank0" x="125" y="354" width="420" height="34" rx="4"/>
    <rect class="rank0" x="125" y="392" width="420" height="34" rx="4"/>
    <path class="grid-line" d="M 177 278 V 426 M 229 278 V 426 M 281 278 V 426 M 333 278 V 426 M 385 278 V 426 M 437 278 V 426 M 489 278 V 426"/>
    <text class="ink label" x="575" y="365">owned rows</text>
    <line class="arrow" x1="555" y1="365" x2="485" y2="365"/>
  </g>

  <line class="double-arrow" x1="335" y1="432" x2="335" y2="475"/>
  <text class="muted small" x="365" y="457">exchange boundary rows</text>

  <g>
    <rect class="ghost" x="125" y="484" width="420" height="34" rx="4"/>
    <text class="ink small" x="335" y="507" text-anchor="middle">Rank 1: top ghost row</text>
    <rect class="rank1" x="125" y="522" width="420" height="34" rx="4"/>
    <rect class="rank1" x="125" y="560" width="420" height="34" rx="4"/>
    <rect class="rank1" x="125" y="598" width="420" height="34" rx="4"/>
    <rect class="rank1" x="125" y="636" width="420" height="34" rx="4"/>
    <path class="grid-line" d="M 177 522 V 670 M 229 522 V 670 M 281 522 V 670 M 333 522 V 670 M 385 522 V 670 M 437 522 V 670 M 489 522 V 670"/>
    <text class="ink label" x="575" y="590">owned rows</text>
    <line class="arrow" x1="555" y1="590" x2="485" y2="590"/>
  </g>

  <rect class="boundary" x="125" y="674" width="420" height="28" rx="4"/>
  <text class="ink tiny" x="335" y="693" text-anchor="middle">fixed global boundary</text>
  <text class="muted tiny" x="118" y="695" text-anchor="end">bottom boundary</text>

  <rect class="panel" x="755" y="125" width="590" height="610" rx="18"/>
  <text class="ink heading" x="1050" y="165" text-anchor="middle">Five-point stencil</text>
  <text class="muted small" x="1050" y="192" text-anchor="middle">The centre is computed from four neighbours.</text>

  <rect class="neighbour" x="990" y="245" width="120" height="78" rx="12"/>
  <text class="ink label" x="1050" y="278" text-anchor="middle">north</text>
  <text class="muted small" x="1050" y="302" text-anchor="middle">ghost or owned</text>

  <rect class="neighbour" x="835" y="375" width="120" height="78" rx="12"/>
  <text class="ink label" x="895" y="408" text-anchor="middle">west</text>
  <text class="muted small" x="895" y="432" text-anchor="middle">neighbour</text>

  <rect class="stencil" x="990" y="375" width="120" height="78" rx="12"/>
  <text class="ink label" x="1050" y="408" text-anchor="middle">centre</text>
  <text class="ink small" x="1050" y="432" text-anchor="middle">new value</text>

  <rect class="neighbour" x="1145" y="375" width="120" height="78" rx="12"/>
  <text class="ink label" x="1205" y="408" text-anchor="middle">east</text>
  <text class="muted small" x="1205" y="432" text-anchor="middle">neighbour</text>

  <rect class="neighbour" x="990" y="505" width="120" height="78" rx="12"/>
  <text class="ink label" x="1050" y="538" text-anchor="middle">south</text>
  <text class="muted small" x="1050" y="562" text-anchor="middle">ghost or owned</text>

  <line class="arrow" x1="1050" y1="325" x2="1050" y2="368"/>
  <line class="arrow" x1="955" y1="414" x2="982" y2="414"/>
  <line class="arrow" x1="1118" y1="414" x2="1140" y2="414"/>
  <line class="arrow" x1="1050" y1="460" x2="1050" y2="500"/>

  <rect class="exchange" x="825" y="625" width="450" height="66" rx="12"/>
  <text class="ink label" x="1050" y="653" text-anchor="middle">MPI_Sendrecv of boundary rows</text>
  <text class="muted small" x="1050" y="678" text-anchor="middle">then launch stencil, synchronize, and swap arrays</text>
</svg>
