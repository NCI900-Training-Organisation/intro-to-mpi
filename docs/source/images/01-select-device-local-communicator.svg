<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">MPI local communicator and GPU selection</title>
  <desc id="desc">MPI world ranks are split into node-local communicators. Each local rank selects a GPU using device equals local rank modulo device count.</desc>
  <defs>
    <style>
      .bg { fill: #f7f5ef; }
      .ink { fill: #1d2935; font-family: sans-serif; }
      .muted { fill: #52606d; font-family: sans-serif; }
      .title { font-size: 30px; font-weight: 700; }
      .heading { font-size: 22px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 700; }
      .small { font-size: 16px; }
      .node-a { fill: #e4f1ed; stroke: #2b7a68; stroke-width: 3; }
      .node-b { fill: #e7edf7; stroke: #3e6195; stroke-width: 3; }
      .rank-a { fill: #ffffff; stroke: #2b7a68; stroke-width: 2; }
      .rank-b { fill: #ffffff; stroke: #3e6195; stroke-width: 2; }
      .gpu-a { fill: #f5d98b; stroke: #a66b00; stroke-width: 2; }
      .gpu-b { fill: #f2b7a7; stroke: #a94d3d; stroke-width: 2; }
      .arrow { stroke: #7a4e18; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .split { stroke: #55616d; stroke-width: 2; stroke-dasharray: 8 7; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a4e18"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="700"/>
  <text class="ink title" x="60" y="58">select_device: from world ranks to local GPUs</text>
  <text class="muted small" x="60" y="88">MPI_Comm_split_type(..., MPI_COMM_TYPE_SHARED, ...) groups only ranks sharing a node.</text>

  <text class="ink heading" x="60" y="135">1. MPI_COMM_WORLD</text>
  <rect class="rank-a" x="60" y="165" width="120" height="82" rx="10"/>
  <rect class="rank-a" x="200" y="165" width="120" height="82" rx="10"/>
  <rect class="rank-b" x="340" y="165" width="120" height="82" rx="10"/>
  <rect class="rank-b" x="480" y="165" width="120" height="82" rx="10"/>
  <text class="ink label" x="120" y="198" text-anchor="middle">world rank 0</text>
  <text class="muted small" x="120" y="225" text-anchor="middle">host A</text>
  <text class="ink label" x="260" y="198" text-anchor="middle">world rank 1</text>
  <text class="muted small" x="260" y="225" text-anchor="middle">host A</text>
  <text class="ink label" x="400" y="198" text-anchor="middle">world rank 2</text>
  <text class="muted small" x="400" y="225" text-anchor="middle">host B</text>
  <text class="ink label" x="540" y="198" text-anchor="middle">world rank 3</text>
  <text class="muted small" x="540" y="225" text-anchor="middle">host B</text>

  <path class="split" d="M 60 275 L 320 275 L 320 315 L 60 315 Z"/>
  <path class="split" d="M 340 275 L 600 275 L 600 315 L 340 315 Z"/>
  <text class="muted small" x="120" y="301">split by shared host</text>
  <text class="muted small" x="400" y="301">split by shared host</text>

  <text class="ink heading" x="60" y="365">2. Node-local communicators</text>
  <rect class="node-a" x="60" y="390" width="260" height="120" rx="14"/>
  <rect class="node-b" x="340" y="390" width="260" height="120" rx="14"/>
  <text class="ink label" x="190" y="420" text-anchor="middle">local communicator A</text>
  <text class="muted small" x="190" y="447" text-anchor="middle">local ranks: 0, 1</text>
  <text class="ink label" x="470" y="420" text-anchor="middle">local communicator B</text>
  <text class="muted small" x="470" y="447" text-anchor="middle">local ranks: 0, 1</text>
  <text class="ink small" x="190" y="480" text-anchor="middle">world 0 -&gt; local 0</text>
  <text class="ink small" x="190" y="501" text-anchor="middle">world 1 -&gt; local 1</text>
  <text class="ink small" x="470" y="480" text-anchor="middle">world 2 -&gt; local 0</text>
  <text class="ink small" x="470" y="501" text-anchor="middle">world 3 -&gt; local 1</text>

  <path class="arrow" d="M 190 510 C 190 555, 160 555, 160 590"/>
  <path class="arrow" d="M 250 510 C 250 555, 280 555, 280 590"/>
  <path class="arrow" d="M 470 510 C 470 555, 440 555, 440 590"/>
  <path class="arrow" d="M 530 510 C 530 555, 560 555, 560 590"/>

  <text class="ink heading" x="690" y="135">3. Device selection on each node</text>
  <rect class="gpu-a" x="690" y="165" width="210" height="95" rx="14"/>
  <rect class="gpu-a" x="930" y="165" width="210" height="95" rx="14"/>
  <text class="ink label" x="795" y="205" text-anchor="middle">GPU 0</text>
  <text class="ink small" x="795" y="235" text-anchor="middle">local rank 0</text>
  <text class="ink label" x="1035" y="205" text-anchor="middle">GPU 1</text>
  <text class="ink small" x="1035" y="235" text-anchor="middle">local rank 1</text>
  <rect class="gpu-b" x="690" y="330" width="210" height="95" rx="14"/>
  <rect class="gpu-b" x="930" y="330" width="210" height="95" rx="14"/>
  <text class="ink label" x="795" y="370" text-anchor="middle">GPU 0</text>
  <text class="ink small" x="795" y="400" text-anchor="middle">local rank 0</text>
  <text class="ink label" x="1035" y="370" text-anchor="middle">GPU 1</text>
  <text class="ink small" x="1035" y="400" text-anchor="middle">local rank 1</text>
  <text class="muted small" x="690" y="465">Each node starts its local numbering at 0.</text>

  <rect x="690" y="520" width="450" height="88" rx="12" fill="#fff" stroke="#7a4e18" stroke-width="3"/>
  <text class="ink label" x="915" y="555" text-anchor="middle">device = local_rank % device_count</text>
  <text class="muted small" x="915" y="580" text-anchor="middle">With 2 ranks and 2 visible GPUs:</text>
  <text class="muted small" x="915" y="600" text-anchor="middle">0 -&gt; GPU 0, 1 -&gt; GPU 1.</text>
</svg>
