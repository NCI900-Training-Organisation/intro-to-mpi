<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">CUDA-aware MPI communication pipeline</title>
  <desc id="desc">The application passes a device pointer directly to CUDA-aware MPI. MPI identifies the pointer through Unified Virtual Addressing and selects a device-capable transport.</desc>
  <defs>
    <style>
      .bg { fill: #f7f5ef; }
      .ink { fill: #1d2935; font-family: sans-serif; }
      .muted { fill: #52606d; font-family: sans-serif; }
      .title { font-size: 30px; font-weight: 700; }
      .heading { font-size: 22px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 700; }
      .small { font-size: 16px; }
      .gpu { fill: #e7edf7; stroke: #3e6195; stroke-width: 3; }
      .host { fill: #e4f1ed; stroke: #2b7a68; stroke-width: 3; }
      .mpi { fill: #eee6f5; stroke: #76529a; stroke-width: 3; }
      .sync { fill: #fff1ee; stroke: #b34d3d; stroke-width: 2; }
      .arrow { stroke: #7a4e18; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .direct { stroke: #2b7a68; stroke-width: 4; fill: none; marker-end: url(#direct-arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a4e18"/>
    </marker>
    <marker id="direct-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b7a68"/>
    </marker>
  </defs>

  <rect class="bg" width="1400" height="760"/>
  <text class="ink title" x="60" y="58">CUDA-aware MPI pipeline</text>
  <text class="muted small" x="60" y="88">The application passes a device pointer directly; MPI identifies it and selects an available transport.</text>

  <rect class="host" x="60" y="130" width="360" height="440" rx="18"/>
  <rect class="host" x="980" y="130" width="360" height="440" rx="18"/>
  <text class="ink heading" x="240" y="172" text-anchor="middle">Sender process</text>
  <text class="ink heading" x="1160" y="172" text-anchor="middle">Receiver process</text>
  <text class="muted small" x="240" y="198" text-anchor="middle">one MPI rank and one GPU</text>
  <text class="muted small" x="1160" y="198" text-anchor="middle">one MPI rank and one GPU</text>

  <rect class="gpu" x="110" y="260" width="260" height="125" rx="14"/>
  <text class="ink label" x="240" y="300" text-anchor="middle">GPU memory</text>
  <text class="muted small" x="240" y="329" text-anchor="middle">cudaMalloc buffer</text>
  <text class="muted small" x="240" y="355" text-anchor="middle">device pointer</text>

  <rect class="gpu" x="1030" y="260" width="260" height="125" rx="14"/>
  <text class="ink label" x="1160" y="300" text-anchor="middle">GPU memory</text>
  <text class="muted small" x="1160" y="329" text-anchor="middle">cudaMalloc buffer</text>
  <text class="muted small" x="1160" y="355" text-anchor="middle">received data</text>

  <rect class="mpi" x="480" y="215" width="440" height="190" rx="18"/>
  <text class="ink heading" x="700" y="255" text-anchor="middle">CUDA-aware MPI</text>
  <text class="muted small" x="700" y="285" text-anchor="middle">MPI_Send / MPI_Recv(device_ptr, ...)</text>
  <text class="muted small" x="700" y="322" text-anchor="middle">UVA pointer classification</text>
  <text class="muted small" x="700" y="350" text-anchor="middle">select transport from locality and configuration</text>
  <line class="arrow" x1="375" y1="322" x2="475" y2="322"/>
  <text class="muted small" x="425" y="290" text-anchor="middle">1. pass pointer</text>
  <line class="arrow" x1="925" y1="322" x2="1025" y2="322"/>
  <text class="muted small" x="975" y="290" text-anchor="middle">3. fill buffer</text>

  <line class="direct" x1="700" y1="415" x2="700" y2="505"/>
  <rect class="host" x="480" y="510" width="440" height="85" rx="16"/>
  <text class="ink label" x="700" y="545" text-anchor="middle">Device-capable transport</text>
  <text class="muted small" x="700" y="572" text-anchor="middle">CUDA IPC, GPUDirect P2P, or GPUDirect RDMA</text>
  <text class="muted small" x="700" y="455" text-anchor="middle">2. MPI chooses a path</text>

  <rect class="sync" x="110" y="620" width="1180" height="58" rx="12"/>
  <text class="ink small" x="700" y="655" text-anchor="middle">The API stays the same, but direct syntax does not prove that GPUDirect RDMA was used.</text>
</svg>
